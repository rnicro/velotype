name: Probe upstream source archive checksum

on:
  push:
    branches: [probe-v0.7.8-source-sha]

permissions:
  contents: read

jobs:
  checksum:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Hash pinned upstream archive
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/manyougz/velotype/archive/07a24a9b5b953539dede8e61a1f7d9d0adbba590.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 180 --output /tmp/velotype-0.7.8.tar.gz "$url"
          sha256sum /tmp/velotype-0.7.8.tar.gz
          stat -c 'archive_size=%s' /tmp/velotype-0.7.8.tar.gz
