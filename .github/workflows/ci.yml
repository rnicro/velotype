name: Validate Velotype package

on:
  push:
    branches: [main]
    paths:
      - "srcpkgs/velotype/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - "srcpkgs/velotype/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velotype-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check shell syntax
        run: |
          set -euo pipefail
          bash -n srcpkgs/velotype/template
          bash -n scripts/prepare-source.sh
          bash -n scripts/test-wayland-patch.sh
          bash -n scripts/test-prepare-source.sh
          bash -n scripts/publish-release.sh
          bash -n scripts/test-publish-release.sh

      - name: Test source checksum and cache behavior
        run: bash scripts/test-prepare-source.sh

      - name: Test Wayland-only feature patch lifecycle
        run: bash scripts/test-wayland-patch.sh

      - name: Test versioned release publication
        run: bash scripts/test-publish-release.sh
