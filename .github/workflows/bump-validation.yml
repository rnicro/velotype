name: Temporary bump validation

on:
  push:
    branches: [bump-velotype-v0.7.8]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: |
          set -euo pipefail
          bash -n srcpkgs/velotype/template
          bash -n scripts/prepare-source.sh
          bash -n scripts/test-wayland-patch.sh
          bash -n scripts/test-prepare-source.sh
          bash -n scripts/publish-release.sh
          bash -n scripts/test-publish-release.sh
      - name: Test source checksum and cache behavior
        run: bash scripts/test-prepare-source.sh
      - name: Test Wayland-only feature patch lifecycle
        run: bash scripts/test-wayland-patch.sh
      - name: Test versioned release publication
        run: bash scripts/test-publish-release.sh
